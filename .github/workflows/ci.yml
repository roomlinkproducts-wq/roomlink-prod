name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values only — no job here ever contacts a real database or
  # service. `prisma generate` and `next build` need these vars to be
  # *present*, not valid (tests mock Prisma and no page/route queries the
  # DB at build time).
  DATABASE_URL: postgresql://roomlink:roomlink@localhost:5432/rmdb?schema=public
  NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3001
  NEXT_PUBLIC_APP_URL: http://localhost:3002
  HOTEL_ADMIN_APP_URL: http://localhost:3001
  NEXT_PUBLIC_ZEGOCLOUD_APP_ID: ci-placeholder
  ZEGOCLOUD_SERVER_SECRET: ci-placeholder-secret-not-used-in-production

jobs:
  ci:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [guest, hotel-admin, super-admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @roomlink/${{ matrix.app }}

      - name: Test
        run: npm test -w @roomlink/${{ matrix.app }}

      - name: Build
        run: npm run build -w @roomlink/${{ matrix.app }}
